<body>
    <table style="border: 4px groove rgb(175, 22, 22); border-collapse:seperate; border-radius:10%;">
        <caption>Danh sách sản phẩm</caption>
        <tr>
            <th class="1" style="border: 1px solid black;" rowspan="">Tên sản phẩm</th>
            <th style="border: 1px solid rgb(5, 61, 12);">Giá (VNĐ)</th>
            <th style="border: 1px solid rgb(63, 28, 179);">Số lượng</th>
        </tr>
        <tr>
            <td style="border: 1px solid black;"> Áo thun</td>
                <td style="border: 1px solid black;">150.000</td>
                <td style="border: 1px solid black;">20</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">Quần jeans</td>
            <td style="border: 1px solid black;">350.000</td>
            <td style="border: 1px solid black;">15</td>
        </tr>
    </table>
    <table border="1">
        <tr>
            <th rowspan="2">Học sinh</th>
            <th colspan="2">Điểm</th>
            <th rowspan="2">Trung bình</th>
        </tr>
        <tr>
            <th>Toán</th>
            <th>Văn</th>
        </tr>
            <td>An</td>
            <td>8.5</td>
            <td>9</td>
            <td>8.5</td>
        <tr>
            <td>Bình</td>
            <td>7.8</td>
            <td>8.2</td>
            <td>8.0</td>
        </tr>




    </table>

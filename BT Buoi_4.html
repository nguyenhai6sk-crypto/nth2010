<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Mẫu Đăng Ký Ứng Tuyển</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 40px 20px; color: #333;">

    <!-- Khung chứa biểu mẫu -->
    <div style="max-width: 550px; margin: 0 auto; background-color: #ffffff; padding: 35px 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); border-top: 6px solid #2563eb;">
        
        <!-- Tiêu đề biểu mẫu -->
        <h2 style="text-align: center; color: #1e3a8a; margin-top: 0; margin-bottom: 8px; font-size: 26px;">ĐĂNG KÝ ỨNG TUYỂN</h2>
        <p style="text-align: center; color: #64748b; margin-top: 0; margin-bottom: 28px; font-size: 14px;">Vui lòng điền đầy đủ thông tin bên dưới để ứng tuyển vị trí mong muốn.</p>

        <!-- Bắt đầu Form -->
        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- Họ và tên -->
            <div style="margin-bottom: 18px;">
                <label for="fullname" style="display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b;">Họ và tên (Full Name) <span style="color: #ef4444;">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="Ví dụ: Nguyễn Văn A" required 
                    style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
            </div>

            <!-- Địa chỉ Email -->
            <div style="margin-bottom: 18px;">
                <label for="email" style="display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b;">Địa chỉ Email (Email Address) <span style="color: #ef4444;">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required 
                    style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
            </div>

            <!-- Số điện thoại -->
            <div style="margin-bottom: 18px;">
                <label for="phone" style="display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b;">Số điện thoại (Phone) <span style="color: #ef4444;">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="Ví dụ: 0912 345 678" required 
                    style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none;">
            </div>

            <!-- Thư giới thiệu bản thân -->
            <div style="margin-bottom: 18px;">
                <label for="cover_letter" style="display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b;">Thư giới thiệu bản thân (Cover Letter)</label>
                <textarea id="cover_letter" name="cover_letter" rows="4" placeholder="Giới thiệu ngắn gọn về kinh nghiệm, kỹ năng và lý do bạn ứng tuyển..." 
                    style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; font-family: inherit; box-sizing: border-box; resize: vertical; outline: none;"></textarea>
            </div>

            <!-- Tải lên CV/Resume -->
            <div style="margin-bottom: 26px;">
                <label for="resume" style="display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b;">Tải lên CV/Resume (Upload Resume/CV) <span style="color: #ef4444;">*</span></label>
                <div style="border: 2px dashed #94a3b8; background-color: #f8fafc; padding: 16px; border-radius: 6px; text-align: center;">
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required 
                        style="font-size: 14px; color: #475569; width: 100%;">
                    <p style="margin: 8px 0 0 0; font-size: 12px; color: #64748b;">Chấp nhận định dạng: PDF, DOC, DOCX (Tối đa 5MB)</p>
                </div>
            </div>

            <!-- Nút gửi biểu mẫu -->
            <div style="text-align: center;">
                <button type="submit" 
                    style="width: 100%; background-color: #2563eb; color: #ffffff; font-size: 16px; font-weight: 600; padding: 13px 20px; border: none; border-radius: 6px; cursor: pointer; letter-spacing: 0.5px;">
                    Gửi Hồ Sơ Ứng Tuyển
                </button>
            </div>

        </form>
    </div> 
    
</body>
</html>
